name: Bug report
description: Report a reproducible problem in Machinist
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Remove secrets, credentials, and private repository data from all examples and logs.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the smallest reliable sequence of commands or configuration that reproduces the problem.
      placeholder: |
        1. Configure ...
        2. Run ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Machinist version
      description: Run `machinist version`, or provide the commit SHA.
      placeholder: v0.1.0 or abc1234
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include the operating system and relevant Go, Git, and agent CLI versions.
      placeholder: macOS 15, Go 1.26.6, Git 2.x, Codex 0.x
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Relevant logs or context
      description: Paste sanitized logs or links that help explain the failure.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched for existing reports of this problem.
          required: true
        - label: I removed secrets, credentials, and private repository data.
          required: true
        - label: This is not a security vulnerability. I will use the private process in SECURITY.md for security reports.
          required: true
